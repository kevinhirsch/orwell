# Owner-permitted soft-failures (#1599 — "no silent fail-soft").
#
# Governing ruling (owner, 2026-07-14): NOTHING fails softly unless it is on THIS
# allowlist. Every genuine failure (an exception / non-2xx / a guard that couldn't run /
# a refused write) must show RED on /admin/status (INCLUDING when auto-corrected) + log at
# WARN/ERROR + reach a RED-eligible recorder. An expected-empty result (no deal, no NPC,
# an empty optional, a capability probe that legitimately returns "unavailable") is normal
# flow, NOT a failure, and is never flagged.
#
# The CI lint (frontend/tests/test_no_silent_failsoft.py) reads this file. It flags a handler
# only when ALL hold: a BROAD catch (Exception/BaseException/bare), a SILENT body (pass /
# return-default / continue — no log, no re-raise, no RED recorder), AND the guarded try-body
# touches a RISK surface (an LLM / engine / HTTP / write-back / generation call). A flagged
# hit PASSES iff (a) its body reaches a RED-eligible recorder [then it is not a hit], OR
# (b) its function/class- or glob-anchored site is granted below, OR (c) it carries an inline
# `# failsoft-ok: <id>` (Python) / `/* failsoft-ok */` (JS/TS) pragma.
#
# `site` is function/class- or file-anchored (NOT a raw line — line numbers drift). A `*`
# makes it a glob (pattern-class) matched against the repo-relative path. Paths are
# repo-relative (frontend/... for the FE app, src/... for the TS engine).
#
# Each entry is ONE owner grant. `records: red-eligible` is the default (a real failure owed a
# RED recorder — a GRANDFATHER grant, burned down by a registry-removal PR). `records: none`
# is the last resort, reserved for telemetry / recorder-self / optional-probe sites where there
# is nowhere left to write (surfacing a logger-down through the same logger is circular).

allow:
  # ─────────────────────────────────────────────────────────────────────────────
  # Class-C — telemetry / recorder-self / optional-probe (records: none).
  # "Logging must never hurt the app": the recorder, logger, or ring itself failing is
  # terminal by design (nowhere left to write). These are the seed of the owner allowlist.
  # ─────────────────────────────────────────────────────────────────────────────
  - id: log-rings-self
    site: frontend/src/log_rings.py
    class: recorder-self
    records: none
    reason: "the RED recorder itself (Ring.push / _RingHandler.emit / record_overseer / record_soft_failure self-swallow) — a telemetry-write failure has nowhere left to write; the WARN log already surfaced the diagnosis."
    approved_by: kevinhirsch
    approved: 2026-07-17
  - id: trace-sink-emit
    site: frontend/src/trace_sink.py
    class: telemetry
    records: none
    reason: "the LLM-I/O trace sink (emit / archive write) — telemetry path; a failed trace write must never break a turn."
    approved_by: kevinhirsch
    approved: 2026-07-17
  - id: llm-trace-emit
    site: frontend/src/llm_trace.py
    class: telemetry
    records: none
    reason: "the durable llm-io.jsonl archive + emit_trace scrub path — telemetry; logging must never hurt the app."
    approved_by: kevinhirsch
    approved: 2026-07-17
  - id: overseer-debug-ledger
    site: frontend/src/orwell_overseer_debug.py
    class: recorder-self
    records: none
    reason: "the opt-in overseer debug-telemetry ring write (~L225) — telemetry must never hurt a turn."
    approved_by: kevinhirsch
    approved: 2026-07-17
  - id: sync-ledger-write
    site: frontend/src/orwell_sync_ledger.py
    class: recorder-self
    records: none
    reason: "the 0065 divergence/belt-fire ledger write (~L455) — a ledger-write failure is best-effort telemetry (already log-and-swallowed by the outer handler)."
    approved_by: kevinhirsch
    approved: 2026-07-17
  - id: token-ledger-write
    site: frontend/src/orwell_token_ledger.py
    class: recorder-self
    records: none
    reason: "the 0069 per-turn token/cost ledger write — telemetry path; a cost-ledger blip must never break a turn."
    approved_by: kevinhirsch
    approved: 2026-07-17
  - id: js-optional-probe
    site: frontend/static/js/**
    class: optional-probe
    records: none
    reason: "browser optional-probe pattern-class (localStorage/JSON.parse(dataset)/navigator/haptics/glass-render capability probes) — an unavailable browser capability or a malformed dataset attribute is expected-empty, not a failure. A genuine client-side game-failure beacon (POST /api/client-log) is deferred to A4 (#1599); until it lands the JS game-failure catches ride this grant too."
    approved_by: kevinhirsch
    approved: 2026-07-17

