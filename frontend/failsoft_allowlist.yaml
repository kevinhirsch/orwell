  # core/database.py — SQL migration helpers (classic schema-migration pattern:
  # each _migrate_* is a bare-except-swallow over a single ALTER TABLE); every
  # migration does a no-op when the column/table already exists, so the catch is
  # the expected path, not a real failure. The risk surface (a single DDL query)
  # is the caller's context, not an LLM/engine risk.
  - id: gf-core-database-migrations
    site: frontend/core/database.py
    class: grandfathered-inherited
    records: red-eligible
    reason: "grandfathered #1844 — all SQL migration helpers (_migrate_* functions). Classic idempotent-schema pattern: each migration catches errors on ALTER TABLE that are the expected \"column exists\" path. The risk surface is a single DDL query, not an LLM/engine call."
    approved_by: kevinhirsch
    approved: 2026-07-22

