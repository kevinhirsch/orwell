<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Brother</title>
  <link rel="stylesheet" href="/static/css/bbai.css" />
</head>
<body>
  <header class="bb-header">
    <h1>BIG BROTHER</h1>
    <span id="engine-status" class="bb-status" title="engine connection">connecting…</span>
  </header>

  <main class="bb-main">
    <!-- Character creation (OOBE) — the step that was missing past account creation -->
    <section id="onboarding" class="bb-card hidden">
      <h2>Create your houseguest</h2>
      <p class="bb-sub">You are the only authored player in the house. Everyone else is generated.</p>
      <form id="oobe-form">
        <label>Your name
          <input id="player-name" name="playerName" type="text" maxlength="40" autocomplete="off" required />
        </label>
        <label>Archetype
          <select id="archetype" name="archetype">
            <option value="">(let the house decide)</option>
            <option value="comp-beast">Competition beast</option>
            <option value="mastermind">Mastermind</option>
            <option value="social-butterfly">Social butterfly</option>
            <option value="floater">Floater</option>
            <option value="villain">Villain</option>
            <option value="underdog">Underdog</option>
            <option value="flirt">Flirt</option>
            <option value="loyalist">Loyalist</option>
            <option value="wildcard">Wildcard</option>
            <option value="analyst">Analyst</option>
            <option value="hothead">Hothead</option>
            <option value="peacemaker">Peacemaker</option>
          </select>
        </label>
        <label>Strategy
          <select id="strategy" name="strategyStyle">
            <option value="">(default for archetype)</option>
            <option value="aggressive">Aggressive</option>
            <option value="social">Social</option>
            <option value="strategic">Strategic</option>
            <option value="under-the-radar">Under the radar</option>
            <option value="emotional">Emotional</option>
            <option value="loyal">Loyal</option>
          </select>
        </label>
        <button type="submit" id="enter-house">Enter the House</button>
        <p id="oobe-error" class="bb-error"></p>
      </form>
    </section>

    <!-- Game: house roster + in-character chat -->
    <section id="game" class="bb-game hidden">
      <aside class="bb-sidebar">
        <div id="player-card" class="bb-player-card"></div>
        <h3>The House <span id="house-count"></span></h3>
        <ul id="house-list" class="bb-house"></ul>
        <label class="bb-moment">Moment
          <select id="moment"></select>
        </label>
        <p class="bb-hint">The moment chooses which managed system prompt is injected.</p>
        <button id="reset-game" class="bb-secondary" type="button">New game</button>
      </aside>

      <div class="bb-chat-wrap">
        <div id="transcript" class="bb-transcript"></div>
        <form id="chat-form" class="bb-chat-form">
          <input id="chat-input" type="text" placeholder="Say something to the house…" autocomplete="off" />
          <button type="submit" id="send">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/static/js/bbai.js"></script>
</body>
</html>
