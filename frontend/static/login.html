<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
<title>Orwell — Login</title>
<script nonce="{{CSP_NONCE}}">
(function(){
  // Pick up the user's saved theme palette so the GLASS-DEFAULT (colorless)
  // panel sits on a theme-tinted base. The background SOURCE itself (#764) is
  // admin-configured and rendered by static/js/login_bg.js — login no longer
  // picks a random theme pattern of its own.
  try {
    var t = JSON.parse(localStorage.getItem('orwell-theme'));
    var s = document.documentElement.style;
    if (t && t.colors) {
      var c = t.colors;
      // Base palette
      s.setProperty('--bg', c.bg);
      s.setProperty('--fg', c.fg);
      s.setProperty('--panel', c.panel);
      s.setProperty('--border', c.border);
      if (c.red) s.setProperty('--red', c.red);
      if (c.green) s.setProperty('--green', c.green);
      // Advanced overrides (input bg, brand color, etc.) — mirrors ADV_KEYS in
      // static/js/theme.js so the login page picks up the user's customizations.
      var a = c.advanced || {};
      var ADV = {
        userBubbleBg:    '--user-bubble-bg',
        aiBubbleBg:      '--ai-bubble-bg',
        bubbleBorder:    '--bubble-border',
        sidebarBg:       '--sidebar-bg',
        brandColor:      '--brand-color',
        hamburgerColor:  '--hamburger-color',
        inputBg:         '--input-bg',
        inputBorder:     '--input-border',
        sendBtnBg:       '--send-btn-bg',
        sendBtnHover:    '--send-btn-hover',
        codeBg:          '--code-bg',
        codeFg:          '--code-fg',
        toggleActive:    '--toggle-active',
      };
      for (var k in ADV) { if (a[k]) s.setProperty(ADV[k], a[k]); }
    }
  } catch(e){}
})();
// Admin-configured login background (#764). login_bg.js fetches the PUBLIC,
// cosmetic-only GET /api/login-background ({source, photo_url}) — never anything
// secret. Until it resolves, the module paints the gradient default, so the glass
// panel never sits over a blank void.
</script>
<style>
  /* Mirror the main app's :root defaults (static/style.css ~line 18) so an
     uncustomized theme — or a fresh browser with no `orwell-theme` in
     localStorage — renders the login page in the same palette as the rest
     of the app instead of a different greys+offwhite scheme. */
  :root {
    --bg: #282c34; --fg: #9cdef2; --panel: #111; --border: #355a66;
    --red: #e06c75; --green: #50fa7b;
    --bg-effect-intensity: 1;
    /* #696 canonical UI font — login.html is a separate page that missed the
       font work; bring it in line with the rest of the app (SF/system sans).
       Mono is reserved for code/technical bits (none on this page). */
    --login-font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', Inter, 'Segoe UI', Roboto, sans-serif;
    /* Element-kit button tokens (mirror static/style.css). */
    --ow-radius-pill: 999px;
    --ow-radius-inner: 16px;
    --ow-tap-min: 44px;
    --ow-fw-semibold: 600;
    --ow-btn-radius: var(--ow-radius-pill, 999px);
    --ow-btn-glass: blur(10px) saturate(118%) brightness(1.12);
  }
  /* ───────────────────────────────────────────────────────────────────────
     #764 — Liquid Glass login. The login is a single GLASS PANEL (the
     functional layer, Apple HIG Materials) floating over an admin-configurable
     ANIMATED BACKGROUND (the content layer). The glass is colorless/neutral —
     it takes color from the moving background behind it; no accent hue on text,
     and the sanctioned accent appears ONLY on the primary sign-in CTA.
     The blur+luminosity material mirrors the app's OrwellWindow kit
     (`body.theme-frosted .ow-window`, style.css). The SVG/Full-Glass refraction
     used elsewhere is a Chromium-only progressive enhancement; the CSS-blur
     baseline here is pixel-identical except the lensing.
     ─────────────────────────────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--login-font);
    background: var(--bg); color: var(--fg);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; min-height: 100dvh;
    padding-top: 15vh;
    transition: padding-top 0.2s ease;
    overflow: hidden; /* the bg layers cover the viewport; nothing scrolls behind them */
  }
  /* The background host — the CONTENT layer the glass floats over. Fixed,
     full-viewport, behind everything (z-index:0). login_bg.js mounts ONE of
     the source layers into it. */
  #login-bg-host {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  #login-bg-host .login-bg { position: absolute; inset: 0; }

  /* gradient (DEFAULT) — a soft-focus MESH gradient in the Apple Sequoia / iOS
     "aurora" wallpaper idiom: several smoothly-blended, heavily-blurred color
     blobs over a deep base, dreamy/out-of-focus, NO hard edges. Rich and
     luminous but not neon. The moving color refracts/blurs through the colorless
     glass panel — which is exactly what sells the liquid-glass look.

     PALETTE PRESETS (Sunset / Aurora / Ocean / Gold / Lavender) are admin-chosen:
     login_bg.js sets data-lbg-preset on this element + the per-preset color vars,
     plus --lbg-speed / --lbg-intensity. The five var sets live in the preset
     blocks below; the defaults here are the Aurora preset (magenta/indigo reads
     beautifully through glass). The mesh is theme-agnostic (its own rich palette).

     The heavy gaussian blur is what makes it read as a soft mesh rather than
     distinct blobs — the panel's own backdrop-blur compounds it. */
  .login-bg-gradient {
    --lbg-c1: #8b6bff;  /* indigo  */
    --lbg-c2: #ff5fb0;  /* magenta */
    --lbg-c3: #ffae66;  /* warm    */
    --lbg-c4: #5fd8ff;  /* cyan    */
    --lbg-base: #2a1c5e; /* lifted violet base — bright, not muddy */
    --lbg-ray: #ffffff;  /* the diagonal aurora light-ray tint */
    --lbg-speed: 26s;
    --lbg-intensity: 1;
  }
  /* The blobs live on a ::before so we can heavily blur ONLY the mesh (a wide
     blur radius on a real layer) without blurring the diagonal ray, and scale it
     up past the viewport so the blur edges never show. The blobs are LARGE and
     reach near-full opacity so they fill the frame and overlap into a rich mesh
     (rather than small dots floating on a dark base). */
  .login-bg-gradient { background: var(--lbg-base); }
  .login-bg-gradient::before {
    content: ""; position: absolute; inset: -25%;
    background:
      radial-gradient(60vmax 60vmax at 16% 12%, color-mix(in srgb, var(--lbg-c1) calc(95% * var(--lbg-intensity)), transparent), transparent 78%),
      radial-gradient(66vmax 66vmax at 86% 10%, color-mix(in srgb, var(--lbg-c2) calc(92% * var(--lbg-intensity)), transparent), transparent 80%),
      radial-gradient(72vmax 72vmax at 74% 92%, color-mix(in srgb, var(--lbg-c3) calc(90% * var(--lbg-intensity)), transparent), transparent 82%),
      radial-gradient(64vmax 64vmax at 20% 86%, color-mix(in srgb, var(--lbg-c4) calc(90% * var(--lbg-intensity)), transparent), transparent 80%);
    background-size: 150% 150%;
    filter: blur(54px) saturate(1.55) brightness(1.14);
    will-change: background-position;
  }
  /* A drifting diagonal "aurora ray" of brighter light streaking across. */
  .login-bg-gradient::after {
    content: ""; position: absolute; inset: -30%;
    background: linear-gradient(118deg,
      transparent 36%,
      color-mix(in srgb, var(--lbg-ray) calc(24% * var(--lbg-intensity)), transparent) 50%,
      transparent 64%);
    filter: blur(30px); mix-blend-mode: screen;
    will-change: transform, opacity;
  }
  .login-bg-gradient.is-animated::before {
    animation: login-mesh-drift var(--lbg-speed, 26s) ease-in-out infinite alternate;
  }
  .login-bg-gradient.is-animated::after {
    animation: login-ray-sweep calc(var(--lbg-speed, 26s) * 1.6) ease-in-out infinite alternate;
  }
  @keyframes login-mesh-drift {
    0%   { background-position: 0% 50%,   100% 40%,  80% 100%, 20% 0%;   }
    50%  { background-position: 70% 10%,  20% 90%,   30% 40%,  90% 70%;  }
    100% { background-position: 100% 60%, 0% 50%,    60% 0%,   0% 100%;  }
  }
  @keyframes login-ray-sweep {
    0%   { transform: translateX(-12%) translateY(6%);  opacity: 0.7; }
    100% { transform: translateX(12%)  translateY(-6%); opacity: 1;   }
  }
  /* ── Palette presets (admin-selectable) — rich, luminous Apple-wallpaper sets ── */
  .login-bg-gradient[data-lbg-preset="sunset"] {
    --lbg-c1: #6a3c9e; --lbg-c2: #ff6a4a; --lbg-c3: #ffc24a; --lbg-c4: #34c2d6;
    --lbg-base: #3a1a4d; --lbg-ray: #ffe6b8;
  }
  .login-bg-gradient[data-lbg-preset="aurora"] {
    --lbg-c1: #8b6bff; --lbg-c2: #ff5fb0; --lbg-c3: #ffae66; --lbg-c4: #5fd8ff;
    --lbg-base: #2a1c5e; --lbg-ray: #ffffff;
  }
  .login-bg-gradient[data-lbg-preset="ocean"] {
    --lbg-c1: #4fe6ff; --lbg-c2: #3f8bff; --lbg-c3: #6a5cff; --lbg-c4: #9af0ff;
    --lbg-base: #11244f; --lbg-ray: #e2f6ff;
  }
  .login-bg-gradient[data-lbg-preset="gold"] {
    /* Soft, warm, luminous gold/amber glow blending into teal (Apple-wallpaper
       warmth) — not a punchy yellow. Muted teal top, warm amber/peach glow low. */
    --lbg-c1: #3aa89a; --lbg-c2: #6fc7a8; --lbg-c3: #f0b878; --lbg-c4: #e8945c;
    --lbg-base: #1a3a36; --lbg-ray: #ffe8c8;
  }
  .login-bg-gradient[data-lbg-preset="lavender"] {
    --lbg-c1: #ffb0d6; --lbg-c2: #cfa8ff; --lbg-c3: #aac0ff; --lbg-c4: #ffd2ec;
    --lbg-base: #3a2c52; --lbg-ray: #ffffff;
  }

  /* photo — a static bundled image OR an admin-provided URL (set inline by JS). */
  .login-bg-photo { background-size: cover; background-position: center; }

  /* particles — a self-contained canvas (login_bg.js). The canvas paints its
     own neutral dots/lines; the gradient base behind supplies the hue. */
  canvas.login-bg-particles { width: 100%; height: 100%; display: block; }

  /* bundled — theme.js spawns its own canvases (#perlin-flow-canvas, etc.). Keep
     them inside the host so they sit behind the glass. */
  #login-bg-host #synapse-canvas, #login-bg-host #rain-canvas,
  #login-bg-host #constellations-canvas, #login-bg-host #perlin-flow-canvas,
  #login-bg-host #petals-canvas, #login-bg-host #sparkles-canvas,
  #login-bg-host #embers-canvas { opacity: var(--bg-effect-intensity, 1); }

  /* Reduced motion — freeze to the STATIC gradient (Apple: no peripheral /
     repetitive animation). The .is-animated class is never added when reduced
     motion is on (login_bg.js), and canvas sources render a single still frame;
     this belt-and-braces rule kills any residual animation too. */
  @media (prefers-reduced-motion: reduce) {
    .login-bg-gradient { animation: none !important; }
    #login-bg-host * { animation: none !important; }
  }

  /* THE GLASS PANEL — the single floating functional layer. */
  .card {
    /* Tinted, very-translucent base so the moving background actually shows
       through (mirrors .ow-window's color-mix base). */
    background-color: color-mix(in srgb, var(--panel, var(--bg)) 30%, transparent);
    /* Subtle specular sheen down the top — a lit, refractive pane, not a flat
       tint. Kept gentle (Apple is subtle). */
    background-image: linear-gradient(180deg,
      color-mix(in srgb, #fff 14%, transparent) 0%,
      color-mix(in srgb, #fff  5%, transparent) 24%,
      transparent 60%);
    /* The frost: blur + saturation lift catches the color behind the glass. */
    backdrop-filter: blur(30px) saturate(180%) brightness(1.05);
    -webkit-backdrop-filter: blur(30px) saturate(180%) brightness(1.05);
    /* Soft luminous hairline (the kit material edge) + soft float shadow +
       a bright top rim where light catches the glass. */
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px; /* very-rounded, concentric with the app's --ow-radius */
    padding: 2rem; width: 360px; max-width: 90vw;
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      inset 0 0 30px rgba(255, 255, 255, 0.05);
    position: relative; z-index: 1;
  }
  /* Increase-contrast: drop the translucency for a solid, bordered panel. */
  @media (prefers-contrast: more) {
    .card {
      background-color: var(--panel);
      background-image: none;
      backdrop-filter: none; -webkit-backdrop-filter: none;
      border-color: var(--fg);
    }
  }
  /* THE HERO — the threshold. The wordmark + greeting are given room to breathe
     above the form so they read as a quiet welcome over the mesh gradient, not a
     cramped form header. Understated, Apple-restrained — a moment of arrival. */
  .logo {
    text-align: center;
    margin: 0.25rem 0 1.9rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
  }
  .logo span {
    font-family: var(--login-font);
    font-size: 2.1rem; font-weight: 600;
    letter-spacing: 0.01em;
    /* Monochrome-consistent, neutral ink (no accent hue on the wordmark — accent
       is reserved for the CTA). A faint luminous lift reads as "lit" on glass. */
    color: var(--ink);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 0 22px rgba(255, 255, 255, 0.12);
  }
  /* The greeting line — short, calm, confident; the sense of arrival. */
  .logo .greeting {
    font-family: var(--login-font);
    font-size: 0.92rem; font-weight: 400;
    color: color-mix(in srgb, var(--ink) 70%, transparent);
    letter-spacing: 0.01em;
  }
  /* Ink on the glass: a NEUTRAL near-white (no accent hue, per #764) with a
     soft text-shadow floor so it stays legible over the moving color behind the
     panel — Apple's vibrancy/legibility intent. The glass material itself is the
     contrast surface; the dark base + blur keep this readable on any source. */
  .card { --ink: #f3f5f8; color: var(--ink); }
  .card { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
  .setup-note { color: color-mix(in srgb, var(--ink) 78%, transparent); font-size: 0.8rem; margin-bottom: 1rem; text-align: center; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: color-mix(in srgb, var(--ink) 82%, transparent); }
  input:not(.remember-check) {
    width: 100%; padding: 0.65rem 0.85rem; margin-bottom: 1rem;
    /* Clean, soft, glass-appropriate field — a light translucent fill that rides
       the panel material (Apple: controls use fills/vibrancy, NOT their own
       glass), not a heavy dark slab that fights the panel. Mirrors the app's
       composer / model-picker input feel. */
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: var(--ow-radius-inner, 12px);
    color: var(--ink); font-size: 0.95rem; font-family: var(--login-font);
    text-shadow: none;
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:not(.remember-check):hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.24); }
  input:not(.remember-check)::placeholder { color: color-mix(in srgb, var(--ink) 42%, transparent); }
  input:focus {
    outline: none;
    border-color: rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
  }
  /* On touch devices keep inputs at >=16px so iOS Safari doesn't zoom the whole
     page when a field is focused (it auto-zooms any focused input under 16px).
     This page has its own inline styles, so it doesn't inherit the main app's
     equivalent rule in static/style.css; mirror it here. !important also lifts
     the dynamically-inserted 2FA input, which pins font-size:14px inline. */
  @media (hover: none) and (pointer: coarse) {
    input:not(.remember-check) { font-size: 16px !important; }
  }
  /* Clear, visible focus ring for keyboard users on every focusable control.
     Neutral white ring (functional, not an accent on content). */
  input:focus-visible, a:focus-visible, button:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.85);
    outline-offset: 2px;
  }
  /* THE PRIMARY CTA composes the shared ELEMENT-KIT button — `.ow-btn
     .ow-btn-prominent` — the SAME primary button the app uses (composer Send,
     decision Confirm, dialogs). login.html is a standalone page that does not load
     style.css, so the kit button rules below MIRROR the kit's single source of
     truth (`body.theme-frosted .ow-btn*` in static/style.css). Do NOT fork the
     look here — keep these in lockstep with the kit. The kit's prominent variant
     is a colorless, luminous glass capsule (owner: glass is colorless; the primary
     action reads by LUMINOSITY + WEIGHT, not hue), semibold SF label, ~44px tap. */
  .ow-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--ow-tap-min, 44px); padding: 8px 16px;
    border-radius: var(--ow-btn-radius); border: 1px solid transparent;
    font-family: var(--login-font); font-weight: var(--ow-fw-semibold, 600); letter-spacing: -0.01em;
    cursor: pointer; -webkit-backdrop-filter: var(--ow-btn-glass); backdrop-filter: var(--ow-btn-glass);
    transition: background-color .18s ease, box-shadow .18s ease,
                transform .14s cubic-bezier(.34,1.56,.64,1), filter .18s ease, opacity .15s ease;
  }
  .ow-btn-prominent {
    background:
      radial-gradient(120% 100% at 30% 0%, rgba(255,255,255,0.30), transparent 55%),
      rgba(255,255,255,0.26);
    color: var(--ink, #fff); text-shadow: none;
    font-weight: var(--ow-fw-semibold, 600);
    border-color: rgba(255,255,255,0.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 4px 14px rgba(0,0,0,0.22);
  }
  .ow-btn-prominent:hover { filter: brightness(1.06); }
  .ow-btn-secondary {
    background-color: color-mix(in srgb, var(--ink, #fff) 12%, transparent);
    border-color: color-mix(in srgb, var(--ink, #fff) 20%, transparent);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink, #fff) 22%, transparent);
    color: var(--ink, #fff);
  }
  /* Login-CTA layout deltas on top of the kit (full-width, calm pressed state). */
  button#submitBtn { width: 100%; font-size: 1rem; }
  button#submitBtn:active { transform: scale(0.985); opacity: 0.92; }
  button#submitBtn:focus-visible { outline: 2px solid rgba(255,255,255,0.9); outline-offset: 2px; }
  button#submitBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Error / throttle state — a clearly legible warm-red on the glass (a status
     color on a transient message is sanctioned; it is not body content). */
  .error {
    color: #ffb3b3; font-size: 0.85rem; margin-bottom: 0.75rem; display: none;
    background: rgba(120, 20, 20, 0.32);
    border: 1px solid rgba(255, 120, 120, 0.4); border-radius: 8px;
    padding: 0.5rem 0.7rem; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }
  .toggle { text-align: center; margin-top: calc(1rem + 4px); font-size: 0.85rem; color: color-mix(in srgb, var(--ink) 62%, transparent); }
  /* The toggle link is neutral underlined ink (no accent on content — accent is
     reserved for the primary CTA only). */
  .toggle a { color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .toggle a:hover { color: #fff; }
  .pw-wrapper { position: relative; margin-bottom: 1rem; }
  .pw-wrapper input:not(.remember-check) { padding-right: 2.5rem; margin-bottom: 0; }
  /* S1-4 (audit): hide the browser-native password reveal/clear glyphs (Edge ::-ms-reveal /
     ::-ms-clear). The custom .pw-toggle is the single reveal affordance — the native control
     was a confusing duplicate (and rendered an ambiguous clear glyph on the empty field). */
  .pw-wrapper input::-ms-reveal,
  .pw-wrapper input::-ms-clear { display: none; }
  .pw-toggle {
    position: absolute; right: 8px; top: 50%;
    /* +1px on the centering offset nudges the eye icon down 1px so it
       lines up visually with the input text baseline. */
    transform: translateY(calc(-50% + 1px));
    background: none; border: none; padding: 4px; cursor: pointer;
    color: color-mix(in srgb, var(--ink) 55%, transparent); width: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-toggle:hover { color: var(--ink); background: none; }
  .pw-toggle svg { display: block; }
  /* S1-A: the "Remember me" choice is a VISIBLE, labelled row. It used to be an
     unlabelled 14×14 dot overlaying the username field (no signifier — read as a
     stray status glyph — and below the 44px coarse-pointer tap floor). The whole
     row is now the hit target; the JS still toggles #rememberToggle by mode and
     reads #remember.checked, so the auth flow is unchanged. */
  .remember-row {
    display: flex; align-items: center; gap: 0.55rem;
    margin: 0 0 1rem; cursor: pointer; min-height: 24px;
    font-size: 0.85rem; color: color-mix(in srgb, var(--ink) 76%, transparent);
    user-select: none; font-family: var(--login-font);
  }
  /* Clean, Apple-style custom checkbox — a soft rounded box that rides the glass;
     neutral by default, the sanctioned check accent only on the CHECKED state
     (no off-brand default browser checkbox). The label is neutral sans ink. */
  .remember-row .remember-check {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; min-width: 18px; margin: 0;
    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    cursor: pointer; position: relative;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .remember-row .remember-check:hover { border-color: rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.14); }
  .remember-row .remember-check:checked {
    background: color-mix(in srgb, var(--accent, var(--red)) 86%, #000);
    border-color: transparent;
  }
  .remember-row .remember-check:checked::after {
    content: ""; position: absolute;
    left: 5px; top: 1px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .remember-row:hover { color: var(--ink); }
  /* The eye glyph — tasteful, monochrome-consistent (neutral ink, not accent),
     sitting above the wordmark as the threshold mark. */
  .logo-eye { width: 2.4rem; height: 2.4rem; color: var(--ink); opacity: 0.92;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35)); }
  /* The eye BLINKS — a quick double-blink (blink-blink) once every ~10s, fitting
     the surveillance / "it's watching you" theme. The eyelid is an eye-shaped
     overlay (.logo-eye-lid) sweeping shut: it scales from 0 height to full twice
     in the first ~0.9s, then stays open for the rest of the 10s cycle. The eye
     itself stays still. */
  .logo-eye-wrap { position: relative; width: 2.4rem; height: 2.4rem; line-height: 0; }
  .logo-eye-wrap .logo-eye { position: absolute; inset: 0; }
  .logo-eye-lid {
    position: absolute; inset: 0;
    transform-origin: center;
    transform: scaleY(0);
    /* The lid mirrors the eye color so a closed lid reads as a filled almond. */
    color: var(--ink); opacity: 0.92;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
    animation: logo-eye-blink 10s ease-in-out infinite;
  }
  @keyframes logo-eye-blink {
    /* two quick blinks up front, then held open (scaleY 0) for the rest. */
    0%   { transform: scaleY(0); }
    2%   { transform: scaleY(1); }
    4%   { transform: scaleY(0); }
    6%   { transform: scaleY(1); }
    8%   { transform: scaleY(0); }
    100% { transform: scaleY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-eye-lid { animation: none; transform: scaleY(0); }
  }
  .version-label {
    position: fixed; bottom: 12px; right: 16px;
    font-size: 0.7rem; opacity: 0.6; /* S1-B: 0.25 was 1.89:1 (AA fail); 0.6 -> ~4.43:1 */
    font-family: var(--login-font);
    pointer-events: none; user-select: none;
  }
  /* Whirlpool-style spinner shown in the submit button while login /
     account-creation work is in flight — replaces the previous "Loading…"
     text. Two-color ring (muted base + accent arc) rotates continuously. */
  .login-spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid color-mix(in srgb, var(--fg, #fff) 22%, transparent);
    border-top-color: var(--accent, var(--red, #e8a830));
    border-radius: 50%;
    animation: login-spin 0.7s linear infinite;
    vertical-align: -3px;
  }
  @keyframes login-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main class="card">
  <h1 class="logo">
    <span class="logo-eye-wrap" aria-hidden="true">
      <svg class="logo-eye" viewBox="0 0 32 32" focusable="false"><path d="M2 16Q9 7 16 7Q23 7 30 16Q23 25 16 25Q9 25 2 16Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="16" r="4.5" fill="currentColor"/></svg>
      <svg class="logo-eye-lid" viewBox="0 0 32 32" focusable="false"><path d="M2 16Q9 7 16 7Q23 7 30 16Q23 25 16 25Q9 25 2 16Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
    </span>
    <span>Orwell</span>
    <span class="greeting" id="greeting">Welcome back</span>
  </h1>
  <p class="setup-note" id="setupNote" style="display:none"></p>

  <div class="error" id="error" role="alert" aria-live="assertive"></div>

  <form id="authForm" autocomplete="on">
    <label for="username">Username</label>
    <div class="pw-wrapper">
      <input id="username" name="username" type="text" required autofocus autocomplete="username">
    </div>

    <label for="password">Password</label>
    <div class="pw-wrapper">
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1" aria-label="Show password">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
      </button>
    </div>

    <label class="remember-row" id="rememberToggle">
      <input type="checkbox" class="remember-check" id="remember" checked>
      <span>Remember me</span>
    </label>

    <div id="confirmGroup" style="display:none">
      <label for="confirmPassword">Confirm Password</label>
      <div class="pw-wrapper">
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
        <button type="button" class="pw-toggle" id="pwToggleConfirm" tabindex="-1" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" id="submitBtn" class="ow-btn ow-btn-prominent">Sign In</button>
  </form>

  <div class="toggle" id="toggleArea" style="display:none">
    <span id="toggleText">Don't have an account? </span>
    <a id="toggleLink" href="#">Sign up</a>
  </div>
</main>

<footer class="version-label" id="version-label"></footer>

<script nonce="{{CSP_NONCE}}">
(async () => {
  // Load version
  try {
    const vr = await fetch('/api/version');
    if (vr.ok) {
      const vd = await vr.json();
      document.getElementById('version-label').textContent = 'v' + vd.version;
    }
  } catch(e) {}

  // Prefill last username
  const usernameInput = document.getElementById('username');
  const savedUser = localStorage.getItem('orwell-last-user');
  if (savedUser && usernameInput) {
    usernameInput.value = savedUser;
    document.getElementById('password').focus();
  }

  const form = document.getElementById('authForm');
  const errEl = document.getElementById('error');
  const setupNote = document.getElementById('setupNote');
  const confirmGroup = document.getElementById('confirmGroup');
  const submitBtn = document.getElementById('submitBtn');
  const toggleArea = document.getElementById('toggleArea');
  const toggleLink = document.getElementById('toggleLink');
  const toggleText = document.getElementById('toggleText');

  let mode = 'login'; // 'login' | 'signup' | 'setup'
  let signupAllowed = false;

  const rememberToggle = document.getElementById('rememberToggle');
  const greeting = document.getElementById('greeting');

  // Threshold copy — a quiet sense of arrival (entering the house), Apple-restrained.
  function setMode(m) {
    mode = m;
    errEl.style.display = 'none';
    if (m === 'setup') {
      if (greeting) greeting.textContent = 'Step inside';
      setupNote.textContent = 'The house is yours to open. Create your account to begin.';
      setupNote.style.display = 'block';
      confirmGroup.style.display = 'block';
      submitBtn.textContent = 'Create Admin Account';
      toggleArea.style.display = 'none';
      rememberToggle.style.display = 'none';
    } else if (m === 'signup') {
      if (greeting) greeting.textContent = 'Step inside';
      setupNote.textContent = 'Create your account to enter the house.';
      setupNote.style.display = 'block';
      confirmGroup.style.display = 'block';
      submitBtn.innerHTML = '<span style="position:relative;top:1px;">Create Account</span>';
      toggleArea.style.display = 'block';
      toggleText.textContent = 'Already have an account? ';
      toggleLink.textContent = 'Sign in';
      rememberToggle.style.display = 'none';
    } else {
      if (greeting) greeting.textContent = 'Welcome back';
      setupNote.style.display = 'none';
      confirmGroup.style.display = 'none';
      submitBtn.textContent = 'Sign In';
      toggleArea.style.display = signupAllowed ? 'block' : 'none';
      toggleText.textContent = "Don't have an account? ";
      toggleLink.textContent = 'Sign up';
      rememberToggle.style.display = '';
    }
  }

  // Check auth status
  try {
    const res = await fetch('/api/auth/status', { credentials: 'same-origin' });
    const data = await res.json();
    if (data.authenticated) {
      window.location.replace('/');
      return;
    }
    signupAllowed = !!data.signup_enabled;
    if (!data.configured) {
      setMode('setup');
    } else {
      setMode('login');
    }
  } catch (e) {
    setMode('login');
  }

  toggleLink.addEventListener('click', (e) => {
    e.preventDefault();
    setMode(mode === 'login' ? 'signup' : 'login');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';
    submitBtn.disabled = true;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    // If in TOTP mode, handle the code submission directly
    if (form._totpMode) {
      const totpInput = document.getElementById('totp-input');
      const code = totpInput ? totpInput.value.trim() : '';
      if (!code) { totpInput.focus(); submitBtn.disabled = false; return; }
      const remember = document.getElementById('remember').checked;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, remember, totp_code: code })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Invalid code');
        if (!data.ok) throw new Error('Login failed');
        form._totpMode = false;
        finishLogin();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
      }
      return;
    }

    // Validate confirm password for setup/signup
    if (mode === 'setup' || mode === 'signup') {
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
      if (password.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
    }

    // Setup or signup first
    if (mode === 'setup' || mode === 'signup') {
      const endpoint = mode === 'setup' ? '/api/auth/setup' : '/api/auth/signup';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Account creation failed');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
    }

    // Login (auto-login after setup/signup too)
    const remember = document.getElementById('remember').checked;
    function finishLogin() {
      const _rem = document.getElementById('remember').checked;
      if (_rem) localStorage.setItem('orwell-last-user', username);
      else localStorage.removeItem('orwell-last-user');
      sessionStorage.removeItem('ody-session-active');
      submitBtn.innerHTML = '<span class="login-spinner" aria-hidden="true"></span>';
      submitBtn.disabled = true;
      Promise.all([
        fetch('/api/sessions', { credentials: 'same-origin' }).then(r => r.json()),
        fetch('/api/auth/features', { credentials: 'same-origin' }).then(r => r.json()),
        fetch('/api/auth/settings', { credentials: 'same-origin' }).then(r => r.json()),
      ]).then(([sess, feat, sett]) => {
        sessionStorage.setItem('ody-prefetch-sessions', JSON.stringify(sess));
        sessionStorage.setItem('ody-prefetch-features', JSON.stringify(feat));
        sessionStorage.setItem('ody-prefetch-settings', JSON.stringify(sett));
      }).catch(() => {}).finally(() => { window.location.replace('/'); });
    }
    async function doLogin(totpCode) {
      const loginBody = { username, password, remember };
      if (totpCode) loginBody.totp_code = totpCode;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(loginBody)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');
      return data;
    }
    try {
      let data = await doLogin();
      // 2FA required — show TOTP input
      if (data.requires_totp) {
        submitBtn.disabled = false;
        // Only add TOTP input once
        if (document.getElementById('totp-input')) return;
        form._totpMode = true;
        const totpWrap = document.createElement('div');
        totpWrap.style.cssText = 'margin-top:12px;';
        totpWrap.innerHTML = '<label for="totp-input" style="font-size:0.85em;opacity:0.7;display:block;margin-bottom:4px;">2FA Code</label><input type="text" id="totp-input" placeholder="Enter 6-digit code" aria-label="Two-factor authentication code" autocomplete="one-time-code" inputmode="numeric" maxlength="8" style="width:100%;padding:10px 12px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;font-size:14px;box-sizing:border-box;text-align:center;letter-spacing:4px;">';
        const formEl = submitBtn.parentElement;
        formEl.insertBefore(totpWrap, submitBtn);
        const totpInput = document.getElementById('totp-input');
        totpInput.focus();
        submitBtn.textContent = 'Verify';
        return;
      }
      finishLogin();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      return;
    }
  });

  // Password show/hide toggles
  const eyeOpen = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeClosed = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>';

  function wireToggle(btnId, inputId) {
    const btn = document.getElementById(btnId);
    const inp = document.getElementById(inputId);
    if (!btn || !inp) return;
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? eyeOpen : eyeClosed;
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      inp.focus();
    });
  }
  wireToggle('pwToggle', 'password');
  wireToggle('pwToggleConfirm', 'confirmPassword');
})();

// Prevent login button and eye toggles from stealing focus on mobile (keeps keyboard open)
document.querySelectorAll('#submitBtn, .pw-toggle').forEach(btn => {
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    btn.click();
  });
});

// Mobile keyboard: shift card up when virtual keyboard opens
if (window.visualViewport) {
  const card = document.querySelector('.card');
  window.visualViewport.addEventListener('resize', () => {
    const vvh = window.visualViewport.height;
    const wh = window.innerHeight;
    if (vvh < wh * 0.8) {
      document.body.style.paddingTop = '5vh';
      // Keep the active input visible without jumping the whole card to the top
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        document.activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } else {
      document.body.style.paddingTop = '';
    }
  });
}
</script>
<script type="module" nonce="{{CSP_NONCE}}" src="/static/js/login_bg.js"></script>
</body>
</html>
