name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A single self-hosted runner serializes every job, so a superseded commit would
# otherwise tie the runner up finishing a run nobody is waiting on. Cancel the
# in-flight run for a ref the moment a newer commit arrives. Keyed per ref, so
# main and each PR have independent groups.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Path filters ────────────────────────────────────────────────────────────
  #
  # One cheap job computes a set of boolean outputs from the PR/push diff; every other job gates its
  # `if:` on the relevant boolean. The point: a job runs ONLY when files it actually exercises change.
  #   - a docs-only PR (`docs/**` only) flips ALL of these false ⇒ every gated job skips ⇒ the PR
  #     goes green in seconds (the unified `ci-gate` reports the required status; see below).
  #   - a frontend-only PR runs only `frontend` (engine + heavy + smoke skip).
  #   - an engine PR runs `test`/`coverage`/`heavy-sims` (frontend skips); etc.
  #
  # The booleans:
  #   engine   — src/tests/features + the build/test config + this workflow → gates `test`, `coverage`.
  #   frontend — frontend/** + this workflow                                → gates `frontend`.
  #   deploy   — src/** + frontend/** + deploy/** + this workflow           → gates `smoke` (boots both).
  #   heavy    — the calibration-relevant inputs (a subset of engine)       → gates `heavy-sims*`.
  #
  # CRITICAL: gated jobs that SKIP must not deadlock a required check. The single `ci-gate` job at the
  # bottom (`if: always()`) is the ONE required check — it passes when no needed job FAILED/was
  # CANCELLED (a SKIP counts as a pass). Point branch protection at `ci-gate`, not the individual jobs.
  changes:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
      heavy: ${{ steps.filter.outputs.heavy }}
      golden: ${{ steps.filter.outputs.golden }}
      visual: ${{ steps.filter.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
          # Need the base ref to diff against on a PR; on push, HEAD~1 is enough.
          fetch-depth: 0
      - name: detect changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # On a PR, diff the base..head; on push, diff against the previous commit.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Diffing against base: $base"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # Helper: does any changed file match the given ERE?
          matches() { echo "$changed" | grep -qE "$1"; }

          # ENGINE: TS sources, all tests, BDD features, the build/test config, this workflow.
          ENGINE_RE='^(src/|tests/|features/|package\.json$|package-lock\.json$|tsconfig.*\.json$|vitest\.config\.ts$|cucumber\.cjs$|\.github/workflows/ci\.yml$)'
          # FRONTEND: the vendored Python app + this workflow.
          FRONTEND_RE='^(frontend/|\.github/workflows/ci\.yml$)'
          # DEPLOY: anything the end-to-end deploy smoke boots — engine, FE, deploy scripts, this workflow.
          DEPLOY_RE='^(src/|frontend/|deploy/|\.github/workflows/ci\.yml$)'
          # HEAVY (calibration-relevant): the simulation inputs. A subset of engine — a docs/frontend
          # change can never move a calibration result, so the heavy lane skips for those.
          HEAVY_RE='^(src/|tests/|package\.json$|package-lock\.json$|vitest\.config\.ts$|cucumber\.cjs$|\.github/workflows/ci\.yml$)'
          # GOLDEN (0108): the golden-path replay exercises the model↔engine seam end to end, so a
          # regression can come from EITHER side — the FE (agent loop, belts, guards), the engine,
          # or the committed fixture itself (frontend/tests/golden/, matched by frontend/).
          GOLDEN_RE='^(frontend/|src/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'
          # VISUAL (0113): the screenshot matrix rides the SAME golden-replay drive as GOLDEN_RE
          # (a regression can come from either side of the seam, or from the FE surfaces the
          # matrix screenshots), plus it additionally cares about the blessed-baselines directory
          # (also under frontend/, already matched) — same trigger surface as golden-path.
          VISUAL_RE='^(frontend/|src/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'

          for name in engine frontend deploy heavy golden visual; do
            case "$name" in
              engine)   re="$ENGINE_RE" ;;
              frontend) re="$FRONTEND_RE" ;;
              deploy)   re="$DEPLOY_RE" ;;
              heavy)    re="$HEAVY_RE" ;;
              golden)   re="$GOLDEN_RE" ;;
              visual)   re="$VISUAL_RE" ;;
            esac
            if matches "$re"; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
              echo "==> ${name}: WILL run"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
              echo "==> ${name}: skipped"
            fi
          done

  # ── Engine gate ───────────────────────────────────────────────────────────────
  # typecheck -> build -> unit/property/arch (minus the heavy sims) -> BDD.
  #
  # The HEAVY end-to-end simulation files (the full-game UAT, the juryReach calibration gate, and the
  # calibration-gradient gate) are split into the parallel `heavy-sims` matrix below (`test:ci` runs
  # `test:unit:fast`, which excludes exactly those). Nothing is dropped — the heavy sims run, in
  # sibling jobs, concurrently — so this job returns in roughly the time of the rest of the suite
  # while the long pole shrinks toward the single slowest sharded leg. The dependency-cruiser
  # Vault-Wall arch test, the live sentinel sweeps, and the BDD gate all still run HERE.
  #
  # PATH-GATED (`changes.engine`): a docs-only / frontend-only PR skips it (the unified `ci-gate`
  # reports green for the skip).
  test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      # The BDD gate (test:bdd) includes the 0072/0073 scenarios whose step defs delegate to the
      # vendored front-end's pytest (the authoritative game-build-wall / gateway assertions, which
      # import the FE app). Those wrappers shell out to `python3 -m pytest`, so the engine test job
      # needs the FE deps too — without them the BDD gate fails with "No module named pytest".
      - run: pip install -r frontend/requirements.txt
      - run: npm run test:ci

  # ── Heavy simulation lane (ONE job — consolidated for the single self-hosted runner) ──────────
  #
  # Plays the full-game UAT, the juryReach calibration gate, and the calibration-gradient gate to
  # completion — the same files `test:ci` excludes — via `npm run test:heavy`, which runs all five
  # heavy files in ONE vitest process. Vitest fans them out across the runner's cores internally.
  #
  # This used to be 15 sharded jobs (uat ×3, jury ×5 + aggregate, gradient ×3 + aggregate) so the play
  # fanned out across many PARALLEL GitHub-hosted runners. On a SINGLE self-hosted runner those jobs
  # serialize anyway, and each one repeats checkout + `npm ci` + build (plus artifact upload/download
  # for the jury/gradient aggregates) — pure overhead with zero parallelism benefit. Collapsing to one
  # job pays the setup cost ONCE. Nothing is dropped: run UNSHARDED, juryReach.property.test.ts and
  # calibrationGradient.property.test.ts each play their full seed set and assert the full band INLINE
  # (the same gate the shard+aggregate pair reconstructs) — see each file's header. Re-shard only if a
  # second runner is added or the hosted lanes come back.
  #
  # PATH-GATED (`changes.heavy`): runs only when calibration-relevant files change. On a skip it
  # doesn't run — `ci-gate` reports the required green status so a docs/frontend-only PR never deadlocks.
  heavy-sims:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:heavy

  # ── Coverage gate ──────────────────────────────────────────────────────────────
  # Per-directory branch thresholds in vitest.config.ts — coverage can no longer silently regress
  # while the functional gate stays green. `test:cov` EXCLUDES the heavy simulation files (under v8
  # instrumentation they re-run the whole live loop a second, slower time yet add no BRANCH coverage in
  # the gated dirs the rest of the live-loop suite doesn't already cover). PATH-GATED (`changes.engine`).
  coverage:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cov

  # ── Deploy smoke ────────────────────────────────────────────────────────────────
  # Build + start the engine, probe the HTTP MCP surface, boot the real front-end against a
  # token-enforcing engine, drive a full turn. PATH-GATED (`changes.deploy` — engine/FE/deploy scripts).
  smoke:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      # The end-to-end smoke stage (B71/ops A7) boots the REAL front-end against a
      # token-enforcing engine and drives a full turn — it needs the FE deps.
      - run: pip install -r frontend/requirements.txt
      - name: deploy scripts parse
        # Enumerate EVERY tracked deploy shell script recursively (incl. nested dirs like
        # deploy/expose/*.sh) — the old non-recursive `deploy/*.sh` glob silently skipped them (#618).
        # The top-level + `**/` pathspecs together cover both the root and nested scripts (git's `**`
        # alone does not match zero intermediate dirs).
        run: for s in $(git ls-files 'deploy/*.sh' 'deploy/**/*.sh'); do bash -n "$s"; done
      - name: engine + system deploy smoke
        run: bash deploy/smoke.sh

  # ── 0108 golden-path replay gate (deterministic, key-free, blocking) ─────────────
  # Replays the committed real-model transcript fixture against the REAL engine + REAL
  # front-end — the FE's model chokepoints re-emit the recorded bytes (no provider, no
  # key, no network beyond loopback) — and asserts the eight golden-path invariants plus
  # the replay contract, TWICE, comparing run digests (a non-deterministic replay is
  # itself a seam bug to fix, never to mute). DORMANT with an explicit notice until the
  # first fixture is recorded and committed; the nightly workflow re-records against the
  # live model so prompt drift surfaces before it lands here.
  golden-path:
    needs: changes
    if: needs.changes.outputs.golden == 'true'
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - name: fixture presence gate
        id: fixture
        run: |
          # Model-agnostic: the gate replays whatever tier the owner recorded (the fixture is
          # model-named; golden_path_replay.py self-resolves the single committed fixture).
          if compgen -G "frontend/tests/golden/golden_path_*.jsonl" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=golden-path dormant::no committed fixture yet — record one against the live narrator (cd frontend && OPENROUTER_API_KEY=… ORWELL_GOLDEN_RECORD=1 python3 scripts/golden_path_record.py --model <narrator> --utility-model <cheap-tier>) and commit frontend/tests/golden/golden_path_<model>.jsonl to arm this gate."
          fi
      - uses: actions/setup-node@v4
        if: steps.fixture.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.fixture.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.fixture.outputs.present == 'true'
        run: npm ci
      - if: steps.fixture.outputs.present == 'true'
        run: npm run build
      - if: steps.fixture.outputs.present == 'true'
        run: pip install -r frontend/requirements.txt
      - name: replay the golden path (twice, deterministic, key-free)
        if: steps.fixture.outputs.present == 'true'
        working-directory: frontend
        run: python3 scripts/golden_path_replay.py --runs 2

  # ── 0113 visual-regression harness (geometry blocking, pixel diff advisory) ──────
  # Screenshot matrix (Tier A chrome x viewport x theme at one parked state; Tier B journey
  # beats x viewport) over the SAME committed golden-replay fixture as golden-path — see
  # docs/features/0113-visual-regression-harness.md. The geometry/off-screen detector
  # (off-viewport / clipped-by-ancestor / zero-size / covered) runs on every shot and BLOCKS
  # the job (wired into ci-gate below); the pixel diff against blessed baselines is ADVISORY
  # ONLY — it never fails the job, it uploads an artifact + appends the job summary. DORMANT
  # with an explicit notice until the first golden fixture is recorded and committed (mirrors
  # golden-path's own dormant shape); an EMPTY baselines/ directory is a legitimate first run
  # (every shot reports baseline-missing, advisory) — it does not gate the geometry half.
  visual-regression:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - name: fixture presence gate
        id: fixture
        run: |
          # Same model-agnostic resolution as golden-path: the harness composes GoldenDriver
          # against whichever single golden_path_*.jsonl is committed.
          if compgen -G "frontend/tests/golden/golden_path_*.jsonl" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=visual-regression dormant::no committed golden fixture yet — this harness rides the SAME fixture as the golden-path gate (see that job's notice to record one); it arms automatically once frontend/tests/golden/golden_path_<model>.jsonl is committed."
          fi
      - uses: actions/setup-node@v4
        if: steps.fixture.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.fixture.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.fixture.outputs.present == 'true'
        run: npm ci
      - if: steps.fixture.outputs.present == 'true'
        run: npm run build
      - if: steps.fixture.outputs.present == 'true'
        run: pip install -r frontend/requirements.txt
      - name: resolve playwright version (cache key)
        id: pw
        if: steps.fixture.outputs.present == 'true'
        run: echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        if: steps.fixture.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: install playwright chromium
        if: steps.fixture.outputs.present == 'true'
        run: python3 -m playwright install chromium
      - name: run the visual-regression matrix (Tier A + Tier B)
        id: run
        if: steps.fixture.outputs.present == 'true'
        working-directory: frontend
        # Geometry findings make this step (and the job) fail via the script's own exit code;
        # a pixel diff never does. `continue-on-error` would also swallow a genuine crash, so
        # instead the script's exit code IS the job's signal — no extra plumbing needed.
        run: python3 scripts/visual_regression.py --tier all --out "$RUNNER_TEMP/visual-run"
      - name: append the run summary to the job summary
        if: always() && steps.fixture.outputs.present == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/visual-run/summary.md" ]; then
            cat "$RUNNER_TEMP/visual-run/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload shots + reports + diff triptychs (advisory artifact)
        if: always() && steps.fixture.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-run
          path: ${{ runner.temp }}/visual-run
          retention-days: 14
          if-no-files-found: ignore

  # ── Front-end gate (SPLIT 3 ways so it fans out across the runner pool) ──────────
  # The vendored Python app is outside the TS tooling. It used to be ONE ~7-min job (the CI long
  # pole). Split into pytest / browser-smoke / responsive-matrix so a multi-runner pool runs them
  # in PARALLEL. All three are PATH-GATED on `changes.frontend`; an engine-only PR skips them.
  # The Python pytest lane, split by the `browser` marker (auto-applied in frontend/tests/conftest.py to
  # every `sync_playwright` test). The ~3750 non-browser tests run PARALLEL under xdist here (~1.5 min vs
  # the old ~12.5-min serial run); the ~100 headless-Chromium tests run in their own serial lane below.
  # Shorter jobs are the whole point: a job that finishes in ~2 min survives a self-hosted-runner fleet
  # blip that would guillotine a 12-min one. `-n 4` (not `auto`) bounds worker memory to a fixed cost so a
  # bigger runner can't spawn N workers × the FastAPI app and OOM the box.
  fe-unit:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: py_compile the front-end (incl. extensionless CLI scripts)
        run: |
          python3 -m py_compile $(git ls-files 'frontend/**/*.py')
          for s in $(git ls-files 'frontend/scripts/*' 'frontend/integrations/**'); do
            head -1 "$s" | grep -q python && python3 -m py_compile "$s" || true
          done
      - name: install front-end deps
        run: pip install -r frontend/requirements.txt
      - name: pytest — non-browser suite, parallel (app-admin 0029, game build 0032)
        run: cd frontend && python3 -m pytest tests/ -m "not browser" -n 4 -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax-check key front-end JS
        run: |
          node --check frontend/static/js/orwellOnboarding.js
          node --check frontend/static/js/orwellStatusPanel.js

  # The headless-Chromium pytest tests (the `browser` marker). Serial (they bind fixed ports / drive a
  # real page) with `--reruns 1` so the known environmental onboarding-scrim flake (#925/#1148/#930)
  # self-recovers within the job instead of reddening the whole run. Needs the chromium binary, installed
  # the same way as the `fe-browser` job (no `--with-deps`: the self-hosted box has the system libs baked
  # in; a sudo apt install is not granted).
  fe-browser-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install front-end deps
        run: pip install -r frontend/requirements.txt
      - name: resolve playwright version (cache key)
        id: pw
        run: echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: install playwright chromium
        run: python3 -m playwright install chromium
      - name: pytest — headless-browser suite, serial + retry-once
        run: cd frontend && python3 -m pytest tests/ -m browser --reruns 1 -q

  fe-browser:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install front-end deps
        run: pip install -r frontend/requirements.txt
      # Cache the Playwright chromium download (keyed to the installed playwright version).
      - name: resolve playwright version (cache key)
        id: pw
        run: |
          pip install playwright
          echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      # NO `--with-deps` (it apt-installs via sudo, which the self-hosted runner does not grant);
      # the runner box has the chromium system libs pre-installed once (the provisioning script
      # bakes them in). Install only the browser binary into ~/.cache.
      - name: install playwright chromium
        run: python3 -m playwright install chromium
      - name: boot smoke — real app, game-build gating (feature 0032)
        run: cd frontend && python3 scripts/boot_smoke.py
      - name: browser smoke — keep-set UI loads, no broken modules (feature 0032)
        run: cd frontend && python3 scripts/browser_smoke.py

  fe-responsive:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install front-end deps
        run: pip install -r frontend/requirements.txt
      - name: resolve playwright version (cache key)
        id: pw
        run: |
          pip install playwright
          echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: install playwright chromium
        run: python3 -m playwright install chromium
      - name: responsive matrix gate — viewports x surfaces (Stream S, ruling 16)
        run: cd frontend && python3 scripts/responsive_matrix.py

  # ── Unified required-check gate (deadlock-free on skip) ──────────────────────────
  #
  # THE single required check — point branch protection HERE, not at the individual gated jobs. It
  # ALWAYS runs (`if: always()`), so its conclusion always resolves even when every upstream job was
  # path-skipped. It passes when no needed job FAILED or was CANCELLED — a `skipped` (path-filtered) or
  # `success` result both count as a pass — and fails otherwise.
  #
  # Why this is genuinely deadlock-free on an all-skip (e.g. a docs-only PR): the gated jobs report
  # `skipped`; `ci-gate` still runs (always()); each `needs.*.result` is `skipped`; the loop below
  # treats `skipped`/`success` as OK and exits 0. No required check is ever left "expected / pending".
  ci-gate:
    timeout-minutes: 5
    needs:
      - changes
      - test
      - coverage
      - smoke
      - golden-path
      - visual-regression
      - fe-unit
      - fe-browser-tests
      - fe-browser
      - fe-responsive
      - heavy-sims
    if: always()
    runs-on: self-hosted
    steps:
      - name: resolve overall CI status
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            test=${{ needs.test.result }}
            coverage=${{ needs.coverage.result }}
            smoke=${{ needs.smoke.result }}
            golden-path=${{ needs.golden-path.result }}
            visual-regression=${{ needs.visual-regression.result }}
            fe-unit=${{ needs.fe-unit.result }}
            fe-browser-tests=${{ needs.fe-browser-tests.result }}
            fe-browser=${{ needs.fe-browser.result }}
            fe-responsive=${{ needs.fe-responsive.result }}
            heavy-sims=${{ needs.heavy-sims.result }}
        run: |
          set -euo pipefail
          echo "Needed job results: $RESULTS"
          fail=0
          for kv in $RESULTS; do
            name="${kv%%=*}"
            result="${kv#*=}"
            # A required job is OK iff it succeeded or was skipped (path-filtered). Anything else
            # (failure / cancelled / — an unexpected empty result) fails the gate.
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "::error::needed job '$name' did not pass (result: '$result')"
                fail=1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "ci-gate: FAIL"
            exit 1
          fi
          echo "ci-gate: PASS (all needed jobs succeeded or were skipped)"
