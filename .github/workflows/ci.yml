name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Path filters ────────────────────────────────────────────────────────────
  #
  # One cheap job computes a set of boolean outputs from the PR/push diff; every other job gates its
  # `if:` on the relevant boolean. The point: a job runs ONLY when files it actually exercises change.
  #   - a docs-only PR (`docs/**` only) flips ALL of these false ⇒ every gated job skips ⇒ the PR
  #     goes green in seconds (the unified `ci-gate` reports the required status; see below).
  #   - a frontend-only PR runs only `frontend` (engine + heavy + smoke skip).
  #   - an engine PR runs `test`/`coverage`/`heavy-sims` (frontend skips); etc.
  #
  # The booleans:
  #   engine   — src/tests/features + the build/test config + this workflow → gates `test`, `coverage`.
  #   frontend — frontend/** + this workflow                                → gates `frontend`.
  #   deploy   — src/** + frontend/** + deploy/** + this workflow           → gates `smoke` (boots both).
  #   heavy    — the calibration-relevant inputs (a subset of engine)       → gates `heavy-sims*`.
  #
  # CRITICAL: gated jobs that SKIP must not deadlock a required check. The single `ci-gate` job at the
  # bottom (`if: always()`) is the ONE required check — it passes when no needed job FAILED/was
  # CANCELLED (a SKIP counts as a pass). Point branch protection at `ci-gate`, not the individual jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base ref to diff against on a PR; on push, HEAD~1 is enough.
          fetch-depth: 0
      - name: detect changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # On a PR, diff the base..head; on push, diff against the previous commit.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Diffing against base: $base"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # Helper: does any changed file match the given ERE?
          matches() { echo "$changed" | grep -qE "$1"; }

          # ENGINE: TS sources, all tests, BDD features, the build/test config, this workflow.
          ENGINE_RE='^(src/|tests/|features/|package\.json$|package-lock\.json$|tsconfig.*\.json$|vitest\.config\.ts$|cucumber\.cjs$|\.github/workflows/ci\.yml$)'
          # FRONTEND: the vendored Python app + this workflow.
          FRONTEND_RE='^(frontend/|\.github/workflows/ci\.yml$)'
          # DEPLOY: anything the end-to-end deploy smoke boots — engine, FE, deploy scripts, this workflow.
          DEPLOY_RE='^(src/|frontend/|deploy/|\.github/workflows/ci\.yml$)'
          # HEAVY (calibration-relevant): the simulation inputs. A subset of engine — a docs/frontend
          # change can never move a calibration result, so the heavy lane skips for those.
          HEAVY_RE='^(src/|tests/|package\.json$|package-lock\.json$|vitest\.config\.ts$|cucumber\.cjs$|\.github/workflows/ci\.yml$)'

          for name in engine frontend deploy heavy; do
            case "$name" in
              engine)   re="$ENGINE_RE" ;;
              frontend) re="$FRONTEND_RE" ;;
              deploy)   re="$DEPLOY_RE" ;;
              heavy)    re="$HEAVY_RE" ;;
            esac
            if matches "$re"; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
              echo "==> ${name}: WILL run"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
              echo "==> ${name}: skipped"
            fi
          done

  # ── Engine gate ───────────────────────────────────────────────────────────────
  # typecheck -> build -> unit/property/arch (minus the heavy sims) -> BDD.
  #
  # The HEAVY end-to-end simulation files (the full-game UAT, the juryReach calibration gate, and the
  # calibration-gradient gate) are split into the parallel `heavy-sims` matrix below (`test:ci` runs
  # `test:unit:fast`, which excludes exactly those). Nothing is dropped — the heavy sims run, in
  # sibling jobs, concurrently — so this job returns in roughly the time of the rest of the suite
  # while the long pole shrinks toward the single slowest sharded leg. The dependency-cruiser
  # Vault-Wall arch test, the live sentinel sweeps, and the BDD gate all still run HERE.
  #
  # PATH-GATED (`changes.engine`): a docs-only / frontend-only PR skips it (the unified `ci-gate`
  # reports green for the skip).
  test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  # ── Heavy simulation lane (split + sharded for wall-clock — NOT a reduction in scope) ──────────
  #
  # Plays the full-game UAT, the juryReach calibration gate, and the calibration-gradient gate to
  # completion — the same files `test:ci` excludes. Every matrix leg is a one-file-per-runner SHARD so
  # the lane's wall-clock is the single slowest leg (target ≤ ~180s), with no cross-file contention.
  # Nothing is dropped — the whole functional suite still runs exactly once per CI run, across runners.
  #
  # Lanes / sharding (each ≤ ~180s; see the PR body's per-lane wall-time table):
  #   uat-12seed-{a,b,c} — the 12-seed never-veto UAT, sharded 3×4 seeds. PER-SEED assertions only
  #                        (no cross-seed aggregate), so each shard asserts INDEPENDENTLY — no recombine.
  #   uat-5seed          — 5-seed always-veto UAT (already ≤180s).
  #   uat-decisions      — decision-type coverage over seeds 1-5 (already ≤180s).
  #   gradient-{0,1}     — the gradient passive+active sweeps, sharded 2×3 seeds, then aggregated.
  #
  # The juryReach calibration gate is sharded SEPARATELY in `jury-shard` + `jury-aggregate` below (it
  # uploads/recombines per-season artifacts). The gradient mirrors that shard+aggregate pattern in its
  # own `gradient-aggregate` job. All band assertions live in the aggregate jobs; the shards only play.
  #
  # PATH-GATED (`changes.heavy`): runs only when calibration-relevant files change. On a skip the legs
  # don't run — `ci-gate` reports the required green status so a docs/frontend-only PR never deadlocks.
  heavy-sims:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim: [uat-12seed-a, uat-12seed-b, uat-12seed-c, uat-5seed, uat-decisions]
    name: heavy-sims (${{ matrix.sim }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:heavy:${{ matrix.sim }}

  # The juryReach calibration gate, SHARDED across runners (~464s as one file historically). The 20
  # passive seeded seasons are independent and per-season seeded, so each shard plays a contiguous
  # 4-seed slice (5 shards × 4 = 20, no overlap) and UPLOADS its per-season measurements as an
  # artifact. NO band assertion happens here — a slice can't see the distribution. `jury-aggregate`
  # downloads all five artifacts, recombines the full 20, and runs the SINGLE distribution assertion.
  # Bands and seed count are UNCHANGED — only WHERE the seeds are played moved.
  jury-shard:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    name: jury-shard (${{ matrix.shard }})
    env:
      JURY_SHARDS: "5"
      JURY_SHARD: ${{ matrix.shard }}
      JURY_RESULTS_DIR: jury-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:heavy:jury
      - name: upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: jury-shard-${{ matrix.shard }}
          path: jury-results/jury-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # Recombine every jury shard and assert the full-20 calibration band — the SAME floor/ceiling reach
  # band, rare-F2-win ceiling, and earned-win teeth the pre-shard single-file gate ran. Green only if
  # the full-20 band holds. Depends on every shard (so all artifacts exist) and downloads them into one dir.
  jury-aggregate:
    # `changes` must be a DIRECT need so `needs.changes.outputs.heavy` resolves in the `if:` below
    # (the needs context exposes only direct dependencies — without it the guard reads empty ⇒ the
    # band assertion would silently never run). `jury-shard` already needs `changes`, so ordering holds.
    needs: [changes, jury-shard]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    name: jury-aggregate (full-20 band)
    env:
      JURY_RESULTS_DIR: jury-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: download all jury shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jury-shard-*
          path: jury-results
          merge-multiple: true
      - run: npm run test:heavy:jury:aggregate

  # The calibration-gradient gate, SHARDED across runners (~321s as one file historically — 6 seeds,
  # each a passive+active full-season pair). The seeds are independent and per-seed seeded, so each
  # shard plays a contiguous 2-seed slice (3 shards × 2 = 6, no overlap) and UPLOADS its per-seed
  # measurements. NO band assertion in a shard — the active-vs-passive monotonic band needs the whole
  # distribution; `gradient-aggregate` recombines and asserts it. Policy/seeds/band UNCHANGED.
  gradient-shard:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: gradient-shard (${{ matrix.shard }})
    env:
      GRADIENT_SHARDS: "3"
      GRADIENT_SHARD: ${{ matrix.shard }}
      GRADIENT_RESULTS_DIR: gradient-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:heavy:gradient
      - name: upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: gradient-shard-${{ matrix.shard }}
          path: gradient-results/gradient-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # Recombine every gradient shard and assert the full monotonic band (active ≥ passive). Green only
  # if the full band holds. Depends on every shard so all artifacts exist.
  gradient-aggregate:
    # `changes` must be a DIRECT need so `needs.changes.outputs.heavy` resolves in the `if:` below
    # (the needs context exposes only direct dependencies — without it the guard reads empty ⇒ the
    # band assertion would silently never run). `gradient-shard` already needs `changes`, so ordering holds.
    needs: [changes, gradient-shard]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    name: gradient-aggregate (full band)
    env:
      GRADIENT_RESULTS_DIR: gradient-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: download all gradient shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gradient-shard-*
          path: gradient-results
          merge-multiple: true
      - run: npm run test:heavy:gradient:aggregate

  # ── Coverage gate ──────────────────────────────────────────────────────────────
  # Per-directory branch thresholds in vitest.config.ts — coverage can no longer silently regress
  # while the functional gate stays green. `test:cov` EXCLUDES the heavy simulation files (under v8
  # instrumentation they re-run the whole live loop a second, slower time yet add no BRANCH coverage in
  # the gated dirs the rest of the live-loop suite doesn't already cover). PATH-GATED (`changes.engine`).
  coverage:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cov

  # ── Deploy smoke ────────────────────────────────────────────────────────────────
  # Build + start the engine, probe the HTTP MCP surface, boot the real front-end against a
  # token-enforcing engine, drive a full turn. PATH-GATED (`changes.deploy` — engine/FE/deploy scripts).
  smoke:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      # The end-to-end smoke stage (B71/ops A7) boots the REAL front-end against a
      # token-enforcing engine and drives a full turn — it needs the FE deps.
      - run: pip install -r frontend/requirements.txt
      - name: deploy scripts parse
        run: for s in deploy/*.sh; do bash -n "$s"; done
      - name: engine + system deploy smoke
        run: bash deploy/smoke.sh

  # ── Front-end gate ──────────────────────────────────────────────────────────────
  # The vendored Python app is outside the TS tooling. Compile-check it, run its pytest suite
  # (app-admin 0029, game build 0032), and boot/browser/responsive-smoke the real app. PATH-GATED
  # (`changes.frontend`): an engine-only PR skips it.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: py_compile the front-end (incl. extensionless CLI scripts)
        run: |
          python3 -m py_compile $(git ls-files 'frontend/**/*.py')
          for s in $(git ls-files 'frontend/scripts/*' 'frontend/integrations/**'); do
            head -1 "$s" | grep -q python && python3 -m py_compile "$s" || true
          done
      - name: install front-end deps
        run: pip install -r frontend/requirements.txt
      - name: pytest (app-admin 0029, game build 0032)
        run: cd frontend && python3 -m pytest tests/ -q
      - name: boot smoke — real app, game-build gating (feature 0032)
        run: cd frontend && python3 scripts/boot_smoke.py
      # Cache the Playwright chromium download so the install is a near-no-op on a cache hit
      # (it otherwise re-downloads the browser bundle every run). Keyed to the installed
      # playwright version, so a dependency bump busts the cache automatically. `install
      # --with-deps` still runs (apt deps are quick / already present); only the ~100MB+
      # browser download is what the cache elides.
      - name: resolve playwright version (cache key)
        id: pw
        run: |
          pip install playwright
          echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: install playwright chromium
        run: python3 -m playwright install --with-deps chromium
      - name: browser smoke — keep-set UI loads, no broken modules (feature 0032)
        run: cd frontend && python3 scripts/browser_smoke.py
      - name: responsive matrix gate — viewports x surfaces (Stream S, ruling 16)
        run: cd frontend && python3 scripts/responsive_matrix.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax-check key front-end JS
        run: |
          node --check frontend/static/js/orwellOnboarding.js
          node --check frontend/static/js/orwellStatusPanel.js

  # ── Unified required-check gate (deadlock-free on skip) ──────────────────────────
  #
  # THE single required check — point branch protection HERE, not at the individual gated jobs. It
  # ALWAYS runs (`if: always()`), so its conclusion always resolves even when every upstream job was
  # path-skipped. It passes when no needed job FAILED or was CANCELLED — a `skipped` (path-filtered) or
  # `success` result both count as a pass — and fails otherwise.
  #
  # Why this is genuinely deadlock-free on an all-skip (e.g. a docs-only PR): the gated jobs report
  # `skipped`; `ci-gate` still runs (always()); each `needs.*.result` is `skipped`; the loop below
  # treats `skipped`/`success` as OK and exits 0. No required check is ever left "expected / pending".
  ci-gate:
    needs:
      - changes
      - test
      - coverage
      - smoke
      - frontend
      - heavy-sims
      - jury-shard
      - jury-aggregate
      - gradient-shard
      - gradient-aggregate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: resolve overall CI status
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            test=${{ needs.test.result }}
            coverage=${{ needs.coverage.result }}
            smoke=${{ needs.smoke.result }}
            frontend=${{ needs.frontend.result }}
            heavy-sims=${{ needs.heavy-sims.result }}
            jury-shard=${{ needs.jury-shard.result }}
            jury-aggregate=${{ needs.jury-aggregate.result }}
            gradient-shard=${{ needs.gradient-shard.result }}
            gradient-aggregate=${{ needs.gradient-aggregate.result }}
        run: |
          set -euo pipefail
          echo "Needed job results: $RESULTS"
          fail=0
          for kv in $RESULTS; do
            name="${kv%%=*}"
            result="${kv#*=}"
            # A required job is OK iff it succeeded or was skipped (path-filtered). Anything else
            # (failure / cancelled / — an unexpected empty result) fails the gate.
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "::error::needed job '$name' did not pass (result: '$result')"
                fail=1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "ci-gate: FAIL"
            exit 1
          fi
          echo "ci-gate: PASS (all needed jobs succeeded or were skipped)"
