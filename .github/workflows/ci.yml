name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Full engine gate: typecheck -> build -> unit/property/arch -> BDD.
  #
  # The two HEAVY end-to-end simulation files (the full-game UAT + the juryReach calibration
  # property) are split out into the parallel `heavy-sims` job below (`test:ci` runs `test:unit:fast`,
  # which excludes exactly those two). Nothing is dropped from the gate — the heavy sims run, in a
  # sibling job, concurrently — so this job now returns in roughly the time of the rest of the suite
  # while the wall-clock long pole shrinks toward the single slowest file. The dependency-cruiser
  # Vault-Wall arch test, the live sentinel sweeps, and the BDD gate all still run HERE.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  # The heavy simulation lane (split from `test` for wall-clock parallelism — NOT a reduction in
  # scope). Plays the full-game UAT (12+5 seeds) and the calibration GRADIENT gate (6 seeds ×
  # passive+active sweeps) to completion — the same files `test:ci` excludes — so together with
  # `test` and the jury shards below, the whole functional suite still runs exactly once per CI
  # run, just across concurrent runners.
  #
  # These files were the wall-clock long pole (on real CI, ~511s for the UAT) and previously ran
  # CONCURRENTLY on the SAME runner inside `npm test`, so they shared 4 vCPUs and contended. Here
  # they fan out one-file-per-runner via the matrix, so each gets a dedicated runner with no
  # cross-file contention — the lane's wall is then the single slowest file, the irreducible floor.
  # The files import src/ directly (vitest transpiles on the fly), so no `npm run build` is needed.
  #
  # The juryReach calibration gate (~464s as a single file) is sharded further below — see
  # `jury-shard` + `jury-aggregate`.
  heavy-sims:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim: [uat, gradient]
    name: heavy-sims (${{ matrix.sim }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:heavy:${{ matrix.sim }}

  # The juryReach calibration gate, SHARDED across runners (was the heavy-sims (jury) entry, ~464s
  # as one file). The 20 passive seeded seasons are independent and per-season seeded, so each shard
  # plays a contiguous 5-seed slice (4 shards × 5 = 20, no overlap) and UPLOADS its per-season
  # measurements as an artifact. NO band assertion happens here — a slice can't see the
  # distribution. The dependent `jury-aggregate` job downloads all four artifacts, recombines the
  # full 20, and runs the SINGLE distribution assertion (the reported required check for the gate).
  # Bands and seed count are UNCHANGED — only WHERE the seeds are played moved.
  jury-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: jury-shard (${{ matrix.shard }})
    env:
      JURY_SHARDS: "4"
      JURY_SHARD: ${{ matrix.shard }}
      JURY_RESULTS_DIR: jury-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:heavy:jury
      - name: upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: jury-shard-${{ matrix.shard }}
          path: jury-results/jury-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # Recombine every jury shard and assert the full-20 calibration band — the SAME floor/ceiling
  # reach band, rare-F2-win ceiling, and earned-win teeth the pre-shard single-file gate ran.
  # This is the reported required check for jury calibration: green only if the full-20 band holds.
  # It depends on every shard (so all four artifacts exist) and downloads them into one dir.
  jury-aggregate:
    runs-on: ubuntu-latest
    needs: jury-shard
    name: jury-aggregate (full-20 band)
    env:
      JURY_RESULTS_DIR: jury-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: download all jury shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jury-shard-*
          path: jury-results
          merge-multiple: true
      - run: npm run test:heavy:jury:aggregate

  # Coverage gate (B70/audit C8): per-directory branch thresholds in vitest.config.ts —
  # coverage can no longer silently regress while the functional gate stays green.
  #
  # `test:cov` now EXCLUDES the two heavy simulation files (see vitest.config.ts HEAVY_SIM_FILES):
  # under v8 instrumentation they re-ran the whole live loop a second, slower time yet add no
  # BRANCH coverage in the gated dirs (engine/composition/adapters-engine) that the rest of the
  # live-loop suite doesn't already cover. The per-directory branch thresholds still hold (and only
  # ever ratchet UP) — re-measured with the exclusion in place.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cov

  # Deploy smoke (feature 0010): build + start the engine, probe the HTTP MCP
  # surface, exercise the game tools, prove channel isolation, simulate an update.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      # The end-to-end smoke stage (B71/ops A7) boots the REAL front-end against a
      # token-enforcing engine and drives a full turn — it needs the FE deps.
      - run: pip install -r frontend/requirements.txt
      - name: deploy scripts parse
        run: for s in deploy/*.sh; do bash -n "$s"; done
      - name: engine + system deploy smoke
        run: bash deploy/smoke.sh

  # Front-end (vendored Python app) is outside the TS tooling. Compile-check it, run its
  # pytest suite (app-admin 0029, game build 0032), and boot-smoke the real app to prove
  # the game-build surface reduction holds server-side (feature 0032 running-instance DoD).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: py_compile the front-end (incl. extensionless CLI scripts)
        run: |
          python3 -m py_compile $(git ls-files 'frontend/**/*.py')
          for s in $(git ls-files 'frontend/scripts/*' 'frontend/integrations/**'); do
            head -1 "$s" | grep -q python && python3 -m py_compile "$s" || true
          done
      - name: install front-end deps
        run: pip install -r frontend/requirements.txt
      - name: pytest (app-admin 0029, game build 0032)
        run: cd frontend && python3 -m pytest tests/ -q
      - name: boot smoke — real app, game-build gating (feature 0032)
        run: cd frontend && python3 scripts/boot_smoke.py
      # Cache the Playwright chromium download so the install is a near-no-op on a cache hit
      # (it otherwise re-downloads the browser bundle every run). Keyed to the installed
      # playwright version, so a dependency bump busts the cache automatically. `install
      # --with-deps` still runs (apt deps are quick / already present); only the ~100MB+
      # browser download is what the cache elides.
      - name: resolve playwright version (cache key)
        id: pw
        run: |
          pip install playwright
          echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: install playwright chromium
        run: python3 -m playwright install --with-deps chromium
      - name: browser smoke — keep-set UI loads, no broken modules (feature 0032)
        run: cd frontend && python3 scripts/browser_smoke.py
      - name: responsive matrix gate — viewports x surfaces (Stream S, ruling 16)
        run: cd frontend && python3 scripts/responsive_matrix.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax-check key front-end JS
        run: |
          node --check frontend/static/js/orwellOnboarding.js
          node --check frontend/static/js/orwellStatusPanel.js
