name: Security Scan (VulnHawk)

# Advisory AI SAST scan (VulnHawk) on a LOCAL Ollama backend — ZERO Claude-subscription usage: it
# never calls Claude (or any cloud LLM), the model runs entirely on your own Ollama. Runs ONCE DAILY
# plus on manual dispatch; deliberately NOT on push/PR, so it never spends anything per change and
# never competes with normal CI on every commit. Still files one deduped GitHub issue per finding.
# Separate from ci.yml and OUT of the required `ci-gate` — it can never block a merge.
#
# CONFIG lives in repo Actions *Variables* (Settings → Secrets and variables → Actions → Variables tab),
# so model/host/scope change without editing this file. Variables (NOT secrets — Ollama is local/unauthenticated):
#   OLLAMA_MODEL    — REQUIRED. The exact `ollama list` tag, e.g. `qwen2.5-coder:32b`. If unset, the
#                     scan fails soft (continue-on-error) and files nothing.
#   OLLAMA_HOST     — base URL the RUNNER can reach Ollama at. Default `http://127.0.0.1:11434` (correct
#                     only if Ollama runs on the runner host itself). The action exposes no host input,
#                     so we pass it via the standard OLLAMA_HOST env the Ollama client reads.
#   VULNHAWK_TARGET — directory to scan. Default `.` (whole repo). Narrow it (e.g. `src`) to bound runtime.
#
# HEADS-UP: this runs on your SINGLE self-hosted runner, so while a scan runs it occupies the runner and
# serializes with CI. A local ~30B model is also slow + lower-quality than a frontier model. Do a manual
# `workflow_dispatch` run first to measure duration/quality before trusting the daily cadence; narrow
# VULNHAWK_TARGET if it ties the runner up too long.

on:
  schedule:
    - cron: '41 8 * * *' # daily ~08:41 UTC (GitHub Actions cron is ALWAYS UTC); adjust to taste
  workflow_dispatch: {} # manual on-demand run (Actions tab → this workflow → "Run workflow")

# Only one scan at a time; let a running scan FINISH rather than be cancelled (a daily/manual cadence
# has little contention, and we want the issue-filing scan to complete so findings actually get filed).
concurrency:
  group: secscan-${{ github.workflow }}
  cancel-in-progress: false

# Least privilege. No `security-events: write` — that only mattered for SARIF upload to Code Scanning,
# which needs GitHub Advanced Security (not enabled on this private repo). Findings go to issues instead.
permissions:
  contents: read
  issues: write # lets the github-script step below open issues for findings

jobs:
  vulnhawk:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # LOCAL Ollama backend → no Claude/cloud call at all (zero subscription usage). The composite's
      # claude-code/codex CLI installs are skipped for backend=ollama, so no Node setup is needed here.
      # Model + host + scope come from repo Variables (see header) so they're editable without code changes.
      # VulnHawk's Ollama client reads OLLAMA_HOST (the action exposes no host input), so we set it here.
      - name: VulnHawk Security Scan (Ollama, advisory)
        continue-on-error: true # advisory: a model/host hiccup or v0.2.0 glitch can never redden the run
        uses: momenbasel/vulnhawk@b878413216e94ba3d6e634c9bf9920578f198ca0 # v0.2.0
        env:
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://127.0.0.1:11434' }}
        with:
          target: ${{ vars.VULNHAWK_TARGET || '.' }}
          backend: 'ollama'
          model: ${{ vars.OLLAMA_MODEL }} # set this repo Variable to your exact `ollama list` tag
          severity: 'medium'
          fail-on-findings: 'false' # advisory — findings never fail the job

      # ── Findings → GitHub issues (free; no GitHub Advanced Security needed) ──────────────────────
      # Parse the SARIF the scan just wrote and open ONE issue per distinct finding. Uses only the
      # first-party github-script action (no extra third-party action — keeps the supply-chain surface
      # minimal). Deduped against every existing `vulnhawk`-labelled issue (open OR closed) via a
      # fingerprint marker in the body, so re-runs never duplicate and a closed issue is never re-filed.
      # Runs on schedule + manual dispatch (the only triggers). Best-effort: wrapped in try/catch and
      # given continue-on-error so it can never redden the advisory run. Capped at 25 new issues per run
      # as a flood guard (the remainder are reported in the run summary, never silently dropped).
      - name: File issues for new findings
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const MAX_PER_RUN = 25;
            try {
              const sarifPath = process.env.VULNHAWK_SARIF || 'vulnhawk-results.sarif';
              if (!fs.existsSync(sarifPath)) { core.info(`No SARIF at ${sarifPath} — nothing to file.`); return; }

              let sarif;
              try { sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8')); }
              catch (e) { core.warning(`Could not parse SARIF: ${e.message}`); return; }

              const { owner, repo } = context.repo;
              const sha = context.sha;
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

              // Flatten SARIF results → a stable fingerprint + readable fields per finding.
              const findings = [];
              for (const run of (sarif.runs || [])) {
                const rules = {};
                for (const r of (run.tool?.driver?.rules || [])) rules[r.id] = r;
                for (const res of (run.results || [])) {
                  const ruleId = res.ruleId || res.rule?.id || 'unknown-rule';
                  const loc = res.locations?.[0]?.physicalLocation;
                  const uri = loc?.artifactLocation?.uri || 'unknown-file';
                  const line = loc?.region?.startLine || 0;
                  const level = res.level || rules[ruleId]?.defaultConfiguration?.level || 'warning';
                  const msg = res.message?.text || rules[ruleId]?.shortDescription?.text || '(no description)';
                  const help = rules[ruleId]?.help?.text || rules[ruleId]?.fullDescription?.text || '';
                  // Prefer SARIF's line-content hash (survives line moves); else rule|file|line.
                  const basis = res.partialFingerprints?.primaryLocationLineHash || `${ruleId}|${uri}|${line}`;
                  const fp = crypto.createHash('sha1').update(basis).digest('hex').slice(0, 16);
                  findings.push({ ruleId, uri, line, level, msg, help, fp });
                }
              }
              if (findings.length === 0) { core.info('Scan reported no findings.'); return; }

              // Collect fingerprints already tracked (open OR closed) so we never re-file.
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'all', labels: 'vulnhawk', per_page: 100,
              });
              const seen = new Set();
              for (const iss of existing) {
                const re = /vulnhawk:fp=([0-9a-f]{16})/g;
                let m; while ((m = re.exec(iss.body || '')) !== null) seen.add(m[1]);
              }

              // New, within-batch-deduped findings.
              const fresh = [];
              const batch = new Set();
              for (const f of findings) {
                if (seen.has(f.fp) || batch.has(f.fp)) continue;
                batch.add(f.fp); fresh.push(f);
              }

              let filed = 0, capped = 0;
              for (const f of fresh) {
                if (filed >= MAX_PER_RUN) { capped++; continue; }
                const codeLink = `${context.serverUrl}/${owner}/${repo}/blob/${sha}/${f.uri}#L${f.line}`;
                const title = `🛡️ [VulnHawk] ${f.ruleId} — ${f.uri}:${f.line}`.slice(0, 256);
                const body = [
                  `**Rule:** \`${f.ruleId}\`  •  **Severity:** ${f.level}`,
                  `**Location:** [\`${f.uri}:${f.line}\`](${codeLink})`,
                  ``,
                  f.msg,
                  f.help ? `\n<details><summary>Rule details</summary>\n\n${f.help}\n\n</details>` : ``,
                  ``,
                  `---`,
                  `<sub>Filed automatically by the VulnHawk scan ([run](${runUrl})). AI-generated — verify before acting. Close when fixed or dismissed; it won't be re-filed.</sub>`,
                  `<!-- vulnhawk:fp=${f.fp} -->`,
                ].join('\n');
                await github.rest.issues.create({ owner, repo, title, body, labels: ['vulnhawk'] });
                filed++;
              }

              const tracked = findings.length - fresh.length;
              core.info(`Findings: ${findings.length} • new issues filed: ${filed} • already tracked: ${tracked} • deferred by cap: ${capped}`);
              const summary = core.summary
                .addHeading('🛡️ VulnHawk', 2)
                .addRaw(`**${findings.length}** finding(s) this scan — **${filed}** new issue(s) filed, **${tracked}** already tracked.`);
              if (capped > 0) summary.addRaw(`\n\n⚠️ ${capped} additional new finding(s) exceeded the ${MAX_PER_RUN}/run cap and were NOT filed this run — they'll be filed on the next run.`);
              await summary.write();
            } catch (e) {
              core.warning(`Issue filing failed (non-fatal): ${e.message}`);
            }
