name: Security Scan (VulnHawk)

# Advisory-only, AI-driven SAST scan (VulnHawk). Deliberately a SEPARATE workflow from ci.yml so it
# is NOT part of the required `ci-gate` check — findings never block a merge. Point branch protection
# at `ci-gate` (as today); leave this workflow OUT of the required set.
#
# Trade-offs accepted for this repo (see the PR description for the full rationale):
#   * VulnHawk is a third-party COMPOSITE action. On the runner it does `pip install vulnhawk`
#     (floating — NOT pinned, even though the `uses:` below is pinned to a commit SHA) and
#     `npm install -g @anthropic-ai/claude-code`, then runs them. That is third-party code executing
#     on our single self-hosted runner — the accepted "self-hosted + cloud LLM" posture.
#   * The `claude-code` backend sends code chunks to Anthropic via the Claude Code CLI — FREE with a
#     Claude subscription (no API-key billing). Private source therefore leaves our infra to the LLM;
#     that egress is inherent to any cloud backend. Use `backend: ollama` if you ever want zero egress.
#
# ONE-TIME SETUP — add a repository secret `CLAUDE_CODE_OAUTH_TOKEN`:
#   On a machine logged into a Claude Max/Team subscription run `claude setup-token`, then add the
#   value under Settings → Secrets and variables → Actions → New repository secret.
#   Without the secret the scan fails soft (continue-on-error) and the job stays green.

on:
  push:
    branches: [main]
    # Only scan when actual code changes — a docs-only / deploy-only push never triggers the workflow,
    # so it never appears as a check there (mirrors ci.yml's path-gating intent).
    paths:
      - 'src/**'
      - 'frontend/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - '.github/workflows/security-scan.yml'

# Match ci.yml: on the single self-hosted runner, cancel a superseded run on the same ref so a stale
# scan nobody is waiting on doesn't tie the runner up. Keyed per ref (main and each PR are independent).
concurrency:
  group: secscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. `security-events: write` only matters if GitHub Advanced Security is enabled on this
# (private) repo — it lets the action's internal SARIF upload reach the Security → Code Scanning tab.
# Without GHAS that upload 403s, which is why the scan step below is `continue-on-error`.
permissions:
  contents: read
  security-events: write
  issues: write # lets the github-script step below open issues for findings

jobs:
  vulnhawk:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # The VulnHawk composite installs the Claude Code CLI via `npm install -g` but does NOT run
      # setup-node itself. On GitHub-hosted runners Node is pre-baked; our self-hosted runner provides
      # it per-job (see ci.yml), so without this the backend-CLI install has no npm on PATH. Node 22
      # matches ci.yml; a user-writable global prefix also avoids needing sudo for `npm install -g`.
      # Python is handled by the action's own setup-python step, so we don't add it here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # VulnHawk v0.2.0, pinned to the tag's commit SHA (the `@v0.2.0` tag itself is mutable). NOTE:
      # the action internally runs `pip install vulnhawk`, which still floats to the latest build — SHA
      # pinning the action does NOT pin the scanner package it pulls.
      #
      # Advisory posture (you chose non-blocking):
      #   * fail-on-findings: false  → findings are informational, never fail the job.
      #   * continue-on-error: true  → an internal SARIF-upload 403 (Code Scanning needs GitHub
      #                                 Advanced Security on a private repo), a missing token, or a
      #                                 v0.2.0 hiccup can't redden the run.
      # Findings still surface in the job log (JSON/markdown output) and in the Security tab when GHAS
      # is enabled. To make findings BLOCK merges later: set fail-on-findings 'true', drop
      # continue-on-error, and add this job to ci-gate's `needs` in ci.yml.
      - name: VulnHawk Security Scan
        continue-on-error: true
        uses: momenbasel/vulnhawk@b878413216e94ba3d6e634c9bf9920578f198ca0 # v0.2.0
        env:
          # Belt-and-suspenders: the Claude Code CLI also reads the OAuth token from this env var in
          # headless/CI mode, alongside the documented `claude-code-oauth-token` input below.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          target: '.'
          backend: 'claude-code' # free with a Claude subscription (no API-key billing)
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          severity: 'medium'
          fail-on-findings: 'false'

      # ── Findings → GitHub issues (free; no GitHub Advanced Security needed) ──────────────────────
      # Parse the SARIF the scan just wrote and open ONE issue per distinct finding. Uses only the
      # first-party github-script action (no extra third-party action — keeps the supply-chain surface
      # minimal). Deduped against every existing `vulnhawk`-labelled issue (open OR closed) via a
      # fingerprint marker in the body, so re-runs never duplicate and a closed issue is never re-filed.
      # Push-to-main only (PR findings stay in the run log). Best-effort: wrapped in try/catch and given
      # continue-on-error so it can never redden the advisory run. Capped at 25 new issues per run as a
      # flood guard (the remainder are reported in the run summary, never silently dropped).
      - name: File issues for new findings
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const MAX_PER_RUN = 25;
            try {
              const sarifPath = process.env.VULNHAWK_SARIF || 'vulnhawk-results.sarif';
              if (!fs.existsSync(sarifPath)) { core.info(`No SARIF at ${sarifPath} — nothing to file.`); return; }

              let sarif;
              try { sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8')); }
              catch (e) { core.warning(`Could not parse SARIF: ${e.message}`); return; }

              const { owner, repo } = context.repo;
              const sha = context.sha;
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

              // Flatten SARIF results → a stable fingerprint + readable fields per finding.
              const findings = [];
              for (const run of (sarif.runs || [])) {
                const rules = {};
                for (const r of (run.tool?.driver?.rules || [])) rules[r.id] = r;
                for (const res of (run.results || [])) {
                  const ruleId = res.ruleId || res.rule?.id || 'unknown-rule';
                  const loc = res.locations?.[0]?.physicalLocation;
                  const uri = loc?.artifactLocation?.uri || 'unknown-file';
                  const line = loc?.region?.startLine || 0;
                  const level = res.level || rules[ruleId]?.defaultConfiguration?.level || 'warning';
                  const msg = res.message?.text || rules[ruleId]?.shortDescription?.text || '(no description)';
                  const help = rules[ruleId]?.help?.text || rules[ruleId]?.fullDescription?.text || '';
                  // Prefer SARIF's line-content hash (survives line moves); else rule|file|line.
                  const basis = res.partialFingerprints?.primaryLocationLineHash || `${ruleId}|${uri}|${line}`;
                  const fp = crypto.createHash('sha1').update(basis).digest('hex').slice(0, 16);
                  findings.push({ ruleId, uri, line, level, msg, help, fp });
                }
              }
              if (findings.length === 0) { core.info('Scan reported no findings.'); return; }

              // Collect fingerprints already tracked (open OR closed) so we never re-file.
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'all', labels: 'vulnhawk', per_page: 100,
              });
              const seen = new Set();
              for (const iss of existing) {
                const re = /vulnhawk:fp=([0-9a-f]{16})/g;
                let m; while ((m = re.exec(iss.body || '')) !== null) seen.add(m[1]);
              }

              // New, within-batch-deduped findings.
              const fresh = [];
              const batch = new Set();
              for (const f of findings) {
                if (seen.has(f.fp) || batch.has(f.fp)) continue;
                batch.add(f.fp); fresh.push(f);
              }

              let filed = 0, capped = 0;
              for (const f of fresh) {
                if (filed >= MAX_PER_RUN) { capped++; continue; }
                const codeLink = `${context.serverUrl}/${owner}/${repo}/blob/${sha}/${f.uri}#L${f.line}`;
                const title = `🛡️ [VulnHawk] ${f.ruleId} — ${f.uri}:${f.line}`.slice(0, 256);
                const body = [
                  `**Rule:** \`${f.ruleId}\`  •  **Severity:** ${f.level}`,
                  `**Location:** [\`${f.uri}:${f.line}\`](${codeLink})`,
                  ``,
                  f.msg,
                  f.help ? `\n<details><summary>Rule details</summary>\n\n${f.help}\n\n</details>` : ``,
                  ``,
                  `---`,
                  `<sub>Filed automatically by the VulnHawk scan ([run](${runUrl})). AI-generated — verify before acting. Close when fixed or dismissed; it won't be re-filed.</sub>`,
                  `<!-- vulnhawk:fp=${f.fp} -->`,
                ].join('\n');
                await github.rest.issues.create({ owner, repo, title, body, labels: ['vulnhawk'] });
                filed++;
              }

              const tracked = findings.length - fresh.length;
              core.info(`Findings: ${findings.length} • new issues filed: ${filed} • already tracked: ${tracked} • deferred by cap: ${capped}`);
              const summary = core.summary
                .addHeading('🛡️ VulnHawk', 2)
                .addRaw(`**${findings.length}** finding(s) this scan — **${filed}** new issue(s) filed, **${tracked}** already tracked.`);
              if (capped > 0) summary.addRaw(`\n\n⚠️ ${capped} additional new finding(s) exceeded the ${MAX_PER_RUN}/run cap and were NOT filed this run — they'll be filed on the next run.`);
              await summary.write();
            } catch (e) {
              core.warning(`Issue filing failed (non-fatal): ${e.message}`);
            }
